name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint-check

      - run: pnpm typecheck

      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install chromium --with-deps

      - run: pnpm test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: |
            test-results/
            examples/basic/playwright-traces.html
          if-no-files-found: ignore
          retention-days: 7
